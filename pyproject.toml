[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logica-bio"
version = "0.1.0"
description = "LogiCA: Model-Agnostic Contextualization & Fine-Tuning of Biological Foundation Models via Logit-Space Contrastive Alignment"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "AI-SysBio Contributors" },
]
keywords = [
  "biological-language-models",
  "protein-language-models",
  "contrastive-learning",
  "cross-attention",
  "deep-mutational-scanning",
  "gibbs-sampling",
  "tcr-epitope",
  "protein-ligand",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=4.38",
  "huggingface-hub>=0.21",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
chem = [
  "selfies>=2.1",
  "rdkit>=2023.9",
  "pyarrow>=14.0",
  "kagglehub>=0.2.9",
]
tcr = [
  "ablang2>=0.1.2",
  "omegaconf>=2.3",
  "safetensors>=0.4",
  "kagglehub>=0.2.9",
]
antibodies = [
  "ablang2>=0.1.2",
  "kagglehub>=0.2.9",
  "pyyaml>=6.0",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
]
all = [
  "selfies>=2.1",
  "rdkit>=2023.9",
  "pyarrow>=14.0",
  "ablang2>=0.1.2",
  "omegaconf>=2.3",
  "safetensors>=0.4",
  "kagglehub>=0.2.9",
  "pytest>=7.4",
]

[project.urls]
Homepage = "https://github.com/AI-SysBio/LogiCA"
Repository = "https://github.com/AI-SysBio/LogiCA"
AbRank = "https://github.com/AI-SysBio/AbRank"
Paper = "https://arxiv.org/abs/2606.18703"

[tool.setuptools.packages.find]
where = ["."]
include = ["logica*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
